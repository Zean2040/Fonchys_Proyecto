<div class="container py-4" style="max-width: 640px;">
  <div class="d-flex align-items-center mb-4">
    <a routerLink="/proveedores" class="btn btn-outline-secondary btn-sm me-3">
      <i class="bi bi-arrow-left"></i>
    </a>
    <h2 class="fw-bold mb-0">
      <i class="bi bi-truck me-2 text-primary"></i>{{ modoEdicion() ? 'Editar proveedor' : 'Nuevo proveedor' }}
    </h2>
  </div>

  @if (error()) {
    <div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i>{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-primary text-white py-3">
        <h6 class="mb-0 fw-semibold"><i class="bi bi-truck me-2"></i>Datos del Proveedor</h6>
      </div>
      <div class="card-body p-4">
        <div class="mb-3">
          <label class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
          <input type="text" class="form-control" formControlName="nombre"
                 [class.is-invalid]="form.controls.nombre.touched && form.controls.nombre.invalid"
                 placeholder="Ej: Distribuidora Lima S.A.C." />
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">RUC</label>
            <input type="text" class="form-control" formControlName="ruc" />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Tel&eacute;fono</label>
            <input type="text" class="form-control" formControlName="telefono" />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" class="form-control" formControlName="email" />
        </div>

        <div class="mb-0">
          <label class="form-label fw-semibold">Direcci&oacute;n</label>
          <input type="text" class="form-control" formControlName="direccion" />
        </div>
      </div>

      <div class="card-footer bg-transparent d-flex gap-2 p-4 border-top">
        <button type="submit" class="btn btn-primary" [disabled]="guardando()">
          <i class="bi bi-floppy me-2"></i>{{ guardando() ? 'Guardando...' : 'Guardar' }}
        </button>
        <a routerLink="/proveedores" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </div>
  </form>
</div>
