<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Fonchys Minimarket</h1>
    <p class="subtitle">Ingresa con tu cuenta</p>

    @if (error()) {
      <p class="alert">{{ error() }}</p>
    }

    <label>
      Email
      <input type="email" formControlName="email" placeholder="correo@ejemplo.com" />
    </label>
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <p class="field-error">El email es obligatorio y debe ser válido.</p>
    }

    <label>
      Contraseña
      <input type="password" formControlName="password" placeholder="••••••••" />
    </label>
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <p class="field-error">La contraseña es obligatoria.</p>
    }

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>
</div>
