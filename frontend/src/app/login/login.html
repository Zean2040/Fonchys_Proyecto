<div class="login-page d-flex align-items-center justify-content-center">
  <div class="container" style="max-width: 420px;">
    <div class="card login-card p-4 mt-5">
      <div class="card-body">
        <div class="text-center mb-4">
          <i class="bi bi-shop fs-1 text-warning"></i>
          <h1 class="brand-title fs-3 mt-2">Fonchys Minimarket</h1>
          <p class="text-muted small">Sistema de Gesti&oacute;n</p>
        </div>

        @if (error()) {
          <div class="alert alert-danger" role="alert">
            <i class="bi bi-exclamation-triangle me-2"></i>{{ error() }}
          </div>
        }

        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="email" formControlName="email"
                     placeholder="correo@ejemplo.com" autofocus />
            </div>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Contrase&ntilde;a</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" formControlName="password"
                     placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" />
            </div>
          </div>
          <button type="submit" class="btn btn-warning w-100 fw-bold py-2" [disabled]="cargando()">
            <i class="bi bi-box-arrow-in-right me-2"></i>{{ cargando() ? 'Ingresando...' : 'Ingresar' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
