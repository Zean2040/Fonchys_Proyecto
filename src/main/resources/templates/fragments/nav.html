<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-warning" th:href="@{/dashboard}">
            <i class="bi bi-shop me-2"></i>Fonchys
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">

                <!-- ADMIN: Dashboard -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>

                <!-- ADMIN y ALMACENERO: Productos -->
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'ALMACENERO')">
                    <a class="nav-link" th:href="@{/productos}">
                        <i class="bi bi-box-seam me-1"></i>Productos
                        <span th:if="${stockBajoCount > 0}"
                              class="badge bg-danger rounded-pill ms-1"
                              th:text="${stockBajoCount}"></span>
                    </a>
                </li>

                <!-- ADMIN y CAJERO: Punto de Venta -->
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'CAJERO')">
                    <a class="nav-link" th:href="@{/ventas/nueva}">
                        <i class="bi bi-cart-plus me-1"></i>Punto de Venta
                    </a>
                </li>

                <!-- ADMIN y CAJERO: Ventas del día -->
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'CAJERO')">
                    <a class="nav-link" th:href="@{/ventas}">
                        <i class="bi bi-receipt me-1"></i>Ventas
                    </a>
                </li>

                <!-- ADMIN: resto del menú -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/ventas/historial}">
                        <i class="bi bi-clock-history me-1"></i>Historial
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/empleados}">
                        <i class="bi bi-people me-1"></i>Empleados
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/usuarios}">
                        <i class="bi bi-person-gear me-1"></i>Usuarios
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/proveedores}">
                        <i class="bi bi-truck me-1"></i>Proveedores
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/reportes}">
                        <i class="bi bi-bar-chart-line me-1"></i>Reportes
                    </a>
                </li>

            </ul>
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i>
                        <span sec:authentication="name">Usuario</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
