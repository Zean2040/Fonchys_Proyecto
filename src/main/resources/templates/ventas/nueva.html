<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Venta - Fonchys Minimarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container py-4" style="max-width: 640px;">
    <h2 class="fw-bold mb-4">
        <i class="bi bi-cart-plus me-2 text-success"></i>Registrar Venta
    </h2>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <form th:action="@{/ventas/registrar}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Producto *</label>
                    <select class="form-select form-select-lg" name="productoId" id="selectProducto"
                            onchange="actualizarPrecio(this)" required>
                        <option value="">-- Seleccione un producto --</option>
                        <option th:each="p : ${productos}"
                                th:value="${p.id}"
                                th:text="${p.nombre + ' - S/. ' + #numbers.formatDecimal(p.precio, 1, 2) + ' (stock: ' + p.stock + ')'}"
                                th:attr="data-precio=${p.precio}, data-stock=${p.stock}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Cantidad *</label>
                    <input type="number" class="form-control form-control-lg" name="cantidad"
                           id="cantidad" min="1" value="1" required onchange="calcularTotal()">
                </div>

                <div class="card bg-light mb-4">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <span class="fw-semibold">Precio unitario:</span>
                        <span class="text-muted" id="lblPrecio">S/. 0.00</span>
                    </div>
                    <hr class="my-0">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <span class="fw-bold fs-5">TOTAL:</span>
                        <span class="fw-bold fs-4 text-success" id="lblTotal">S/. 0.00</span>
                    </div>
                </div>

                <button type="submit" class="btn btn-success btn-lg w-100">
                    <i class="bi bi-check-circle me-2"></i>Confirmar Venta
                </button>
            </form>
        </div>
    </div>

    <a th:href="@{/ventas}" class="btn btn-outline-secondary mt-3">
        <i class="bi bi-arrow-left me-2"></i>Volver a Ventas
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function actualizarPrecio(select) {
        const opt = select.options[select.selectedIndex];
        const precio = parseFloat(opt.getAttribute('data-precio') || 0);
        document.getElementById('lblPrecio').textContent = 'S/. ' + precio.toFixed(2);
        calcularTotal();
    }

    function calcularTotal() {
        const select = document.getElementById('selectProducto');
        const opt = select.options[select.selectedIndex];
        const precio = parseFloat(opt.getAttribute('data-precio') || 0);
        const cantidad = parseInt(document.getElementById('cantidad').value || 0);
        document.getElementById('lblTotal').textContent = 'S/. ' + (precio * cantidad).toFixed(2);
    }
</script>
</body>
</html>
