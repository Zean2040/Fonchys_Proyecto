<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${usuario.id != null} ? 'Editar Usuario - Fonchys' : 'Nuevo Usuario - Fonchys'">Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container py-4" style="max-width: 640px;">

    <div class="d-flex align-items-center mb-4">
        <a th:href="@{/usuarios}" class="btn btn-outline-secondary btn-sm me-3">
            <i class="bi bi-arrow-left"></i>
        </a>
        <div>
            <h2 class="fw-bold mb-0">
                <i class="bi bi-person-gear me-2 text-primary"></i>
                <span th:text="${usuario.id != null} ? 'Editar Usuario' : 'Nuevo Usuario'">Usuario</span>
            </h2>
            <small class="text-muted">Gestión de acceso al sistema</small>
        </div>
    </div>

    <!-- Alertas -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-3">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form th:action="@{/usuarios/guardar}" method="post" id="formUsuario">
        <input type="hidden" name="id" th:value="${usuario.id}">

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">

                <!-- Nombre -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nombre completo *</label>
                    <input type="text" name="nombre" class="form-control"
                           th:value="${usuario.nombre}" placeholder="Ej: Juan Pérez" required>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email de acceso *</label>
                    <input type="email" name="email" class="form-control" id="inputEmail"
                           th:value="${usuario.email}" placeholder="correo@fonchys.com" required>
                    <div class="form-text">Este email se usará para iniciar sesión.</div>
                </div>

                <!-- Contraseña -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Contraseña
                        <span th:if="${usuario.id == null}" class="text-danger">*</span>
                        <span th:if="${usuario.id != null}" class="text-muted fw-normal small">(dejar vacío para no cambiar)</span>
                    </label>
                    <div class="input-group">
                        <input type="password" name="password" class="form-control" id="inputPassword"
                               placeholder="Mínimo 6 caracteres"
                               th:required="${usuario.id == null}">
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
                            <i class="bi bi-eye" id="iconoOjo"></i>
                        </button>
                    </div>
                </div>

                <hr class="my-3">

                <!-- Rol -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Rol del sistema *</label>
                    <div class="row g-2">
                        <div th:each="r : ${roles}" class="col-auto">
                            <input type="radio" class="btn-check" name="rol"
                                   th:id="${'rol_' + r.name()}"
                                   th:value="${r.name()}"
                                   th:checked="${usuario.rol != null and usuario.rol == r}">
                            <label class="btn btn-outline-secondary" th:for="${'rol_' + r.name()}">
                                <i th:class="${r.name() == 'ADMIN'} ? 'bi bi-shield-fill me-1 text-danger' :
                                             (${r.name() == 'CAJERO'} ? 'bi bi-cash-register me-1 text-primary' :
                                              'bi bi-boxes me-1 text-warning')"></i>
                                <span th:text="${r.name() == 'ADMIN'} ? 'Administrador' :
                                              (${r.name() == 'CAJERO'} ? 'Cajero' : 'Almacenero')"></span>
                            </label>
                        </div>
                    </div>
                    <div class="form-text mt-2">
                        <strong>Admin:</strong> acceso total ·
                        <strong>Cajero:</strong> punto de venta ·
                        <strong>Almacenero:</strong> gestión de productos
                    </div>
                </div>

                <hr class="my-3">

                <!-- Empleado vinculado (opcional) -->
                <div class="mb-0">
                    <label class="form-label fw-semibold">
                        Vincular con empleado
                        <span class="badge bg-light text-muted border fw-normal ms-1">Opcional</span>
                    </label>
                    <select name="empleadoId" class="form-select">
                        <option value="">-- Sin vínculo --</option>
                        <!-- Empleado actualmente vinculado (si existe y ya tiene cuenta) -->
                        <option th:if="${usuario.empleado != null}"
                                th:value="${usuario.empleado.id}"
                                th:text="${usuario.empleado.nombreCompleto} + ' (' + ${usuario.empleado.cargo} + ')'"
                                selected></option>
                        <!-- Empleados disponibles (sin cuenta) -->
                        <option th:each="emp : ${empleados}"
                                th:if="${usuario.empleado == null or usuario.empleado.id != emp.id}"
                                th:value="${emp.id}"
                                th:text="${emp.nombreCompleto} + ' (' + ${emp.cargo} + ')'">
                        </option>
                    </select>
                    <div class="form-text">
                        Asocia esta cuenta con un empleado registrado.
                        Solo aparecen empleados que aún no tienen cuenta.
                    </div>
                </div>

            </div>
            <div class="card-footer bg-transparent d-flex gap-2 p-4">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-floppy me-2"></i>
                    <span th:text="${usuario.id != null} ? 'Actualizar' : 'Crear usuario'">Guardar</span>
                </button>
                <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePassword() {
        const input = document.getElementById('inputPassword');
        const icon  = document.getElementById('iconoOjo');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }
</script>
</body>
</html>
