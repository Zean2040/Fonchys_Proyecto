<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Productos - Fonchys Minimarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-box-seam me-2 text-primary"></i>Productos
        </h2>
        <a th:href="@{/productos/nuevo}" class="btn btn-primary" sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-plus-circle me-2"></i>Nuevo Producto
        </a>
    </div>

    <!-- Alertas -->
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Búsqueda -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/productos}" method="get" class="d-flex gap-2">
                <input type="text" name="buscar" class="form-control" placeholder="Buscar por nombre..."
                       th:value="${buscar}">
                <button type="submit" class="btn btn-outline-primary">
                    <i class="bi bi-search"></i>
                </button>
                <a th:href="@{/productos}" class="btn btn-outline-secondary">
                    <i class="bi bi-x-lg"></i>
                </a>
            </form>
        </div>
    </div>

    <!-- Tabla de productos -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio (S/.)</th>
                        <th>Stock</th>
                        <th>Estado</th>
                        <th sec:authorize="hasRole('ADMIN')">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(productos)}">
                        <td colspan="7" class="text-center text-muted py-4">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>No hay productos registrados
                        </td>
                    </tr>
                    <tr th:each="p : ${productos}">
                        <td th:text="${p.id}"></td>
                        <td>
                            <span class="fw-semibold" th:text="${p.nombre}"></span>
                            <small class="text-muted d-block" th:text="${p.descripcion}"></small>
                        </td>
                        <td>
                            <span class="badge bg-secondary" th:text="${p.categoria != null ? p.categoria.nombre : 'Sin categoría'}"></span>
                        </td>
                        <td class="fw-bold text-success" th:text="${#numbers.formatDecimal(p.precio, 1, 2)}"></td>
                        <td>
                            <span th:class="${p.stock <= 5} ? 'badge bg-danger' : 'badge bg-success'"
                                  th:text="${p.stock}"></span>
                        </td>
                        <td>
                            <span th:if="${p.activo}" class="badge bg-success">Activo</span>
                            <span th:unless="${p.activo}" class="badge bg-secondary">Inactivo</span>
                        </td>
                        <td sec:authorize="hasRole('ADMIN')">
                            <a th:href="@{/productos/editar/{id}(id=${p.id})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/productos/desactivar/{id}(id=${p.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('¿Desactivar este producto?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small">
            Total: <strong th:text="${productos.size()}">0</strong> productos
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
