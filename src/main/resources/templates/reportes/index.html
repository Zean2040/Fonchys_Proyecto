<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reportes - Fonchys Minimarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bar-chart-line me-2 text-primary"></i>Reportes de Ventas
        </h2>
        <a th:href="${(fechaInicio != null and !fechaInicio.isEmpty()) ?
                       '/reportes/ventas/excel?fechaInicio=' + fechaInicio + '&fechaFin=' + fechaFin :
                       '/reportes/ventas/excel'}"
           class="btn btn-success">
            <i class="bi bi-file-earmark-excel me-2"></i>Exportar Excel
        </a>
    </div>

    <!-- Filtro de fechas -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/reportes}" method="get" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Fecha Inicio</label>
                    <input type="date" name="fechaInicio" class="form-control" th:value="${fechaInicio}">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Fecha Fin</label>
                    <input type="date" name="fechaFin" class="form-control" th:value="${fechaFin}">
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-funnel me-1"></i>Filtrar
                    </button>
                    <a th:href="@{/reportes}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-lg me-1"></i>Hoy
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Tarjetas de resumen -->
    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-xl-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-3 bg-success bg-opacity-10 p-3">
                        <i class="bi bi-cash-stack fs-3 text-success"></i>
                    </div>
                    <div>
                        <div class="text-muted small">Total Ingresos</div>
                        <div class="fs-4 fw-bold text-success">
                            S/. <span th:text="${#numbers.formatDecimal(totalIngresos, 1, 2)}">0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-3 bg-primary bg-opacity-10 p-3">
                        <i class="bi bi-receipt-cutoff fs-3 text-primary"></i>
                    </div>
                    <div>
                        <div class="text-muted small">Ventas Completadas</div>
                        <div class="fs-4 fw-bold text-primary" th:text="${ventasCompletadas}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-3 bg-danger bg-opacity-10 p-3">
                        <i class="bi bi-x-circle fs-3 text-danger"></i>
                    </div>
                    <div>
                        <div class="text-muted small">Ventas Anuladas</div>
                        <div class="fs-4 fw-bold text-danger" th:text="${ventasAnuladas}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-3 bg-warning bg-opacity-10 p-3">
                        <i class="bi bi-graph-up fs-3 text-warning"></i>
                    </div>
                    <div>
                        <div class="text-muted small">Ticket Promedio</div>
                        <div class="fs-4 fw-bold text-warning">
                            S/. <span th:text="${#numbers.formatDecimal(ticketPromedio, 1, 2)}">0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabla de ventas -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-0 py-3">
            <h5 class="mb-0 fw-semibold">
                <i class="bi bi-table me-2 text-secondary"></i>Detalle de Ventas
            </h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Fecha y Hora</th>
                        <th>Cajero</th>
                        <th>Items</th>
                        <th>Total (S/.)</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(ventas)}">
                        <td colspan="6" class="text-center text-muted py-4">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>No hay ventas en el período seleccionado
                        </td>
                    </tr>
                    <tr th:each="v : ${ventas}">
                        <td th:text="${v.id}"></td>
                        <td>
                            <span th:text="${#temporals.format(v.fecha, 'dd/MM/yyyy HH:mm')}"></span>
                        </td>
                        <td th:text="${v.usuario != null ? v.usuario.nombre : '—'}"></td>
                        <td>
                            <span class="badge bg-secondary" th:text="${v.detalles.size()}"></span>
                        </td>
                        <td class="fw-bold" th:text="${#numbers.formatDecimal(v.total, 1, 2)}"></td>
                        <td>
                            <span th:if="${v.estado.name() == 'COMPLETADA'}" class="badge bg-success">Completada</span>
                            <span th:unless="${v.estado.name() == 'COMPLETADA'}" class="badge bg-danger">Anulada</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small d-flex justify-content-between">
            <span>Total registros: <strong th:text="${ventas.size()}">0</strong></span>
            <span th:if="${fechaInicio != null and !fechaInicio.isEmpty()}">
                Período: <strong th:text="${fechaInicio}"></strong> al <strong th:text="${fechaFin}"></strong>
            </span>
            <span th:unless="${fechaInicio != null and !fechaInicio.isEmpty()}">Todas las ventas</span>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
