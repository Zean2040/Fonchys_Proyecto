# ================================
# Servidor
# ================================
server.port=8080

# ================================
# MySQL - Cambia tu_password_aqui
# ================================
spring.datasource.url=jdbc:mysql://localhost:3306/fonchys_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================
# JPA / Hibernate
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ================================
# Thymeleaf
# ================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ================================
# Logging (Logback - configurado en logback-spring.xml)
# ================================
logging.level.com.fonchys=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
