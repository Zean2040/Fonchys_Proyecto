# ============================================================
#  Perfil de PRODUCCION - Fonchys Minimarket
#  Activar con: java -jar fonchys-minimarket-1.0.0.jar --spring.profiles.active=prod
#  O definir variable de entorno: SPRING_PROFILES_ACTIVE=prod
#
#  IMPORTANTE: Definir estas variables de entorno en el servidor
#  antes de ejecutar la aplicacion.
# ============================================================

# ================================
# Servidor
# ================================
server.port=${PORT:8080}

# ================================
# Base de Datos (variables de entorno obligatorias)
# ================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/fonchys_db?useSSL=true&serverTimezone=America/Lima&allowPublicKeyRetrieval=false
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones optimizado para produccion
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ================================
# JPA / Hibernate (sin auto-creacion en produccion)
# ================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ================================
# Thymeleaf (cache habilitado en produccion)
# ================================
spring.thymeleaf.cache=true

# ================================
# Logging
# ================================
logging.level.com.fonchys=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ================================
# Actuator (solo health publico en produccion)
# ================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.info.env.enabled=true
info.app.name=Fonchys Minimarket
info.app.version=1.0.0
